name: MR LEE Culture V39 — five licensed Korean subway photos
on:
  push:
    branches: [main]
    paths:
      - 'assets/culture/subway-v39-sources.json'
      - 'tools/build-culture-subway-v39.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: culture-v39-subway-build
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python tools/build-culture-subway-v39.py
      - name: Publish five licensed WebP images
        run: |
          git config user.name "mrlee-photo-qa[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/culture-v39-photo/tau-dien-ngam/ assets/culture/subway-v39-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Culture V39: publish five licensed 3-to-2 Korean subway photos"
            git push origin HEAD:main
          fi
