name: MR LEE Homepage Hamburger Dropdown QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/branding/home-menu-dropdown.css'
      - 'assets/v20/home.js'
      - 'tools/browser-home-menu.mjs'
      - '.github/workflows/mrlee-home-menu-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source code and required entry links
        run: |
          node --check assets/v20/home.js
          node --check tools/browser-home-menu.mjs
          node tools/check-site.mjs
          node tools/check-ui-phase5.mjs
          node tools/build-cloudflare-pages.mjs
          node tools/check-cloudflare-pages-build.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test desktop/mobile hamburger, themes, and no layout shift
        run: node tools/browser-home-menu.mjs
