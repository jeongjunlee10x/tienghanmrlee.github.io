name: MR LEE Six Standalone Game Rooms QA
on:
  push:
    branches: [main]
    paths:
      - 'game-bai-mau.html'
      - 'game-co-vua.html'
      - 'game-tien-len.html'
      - 'game-co-ca-ngua.html'
      - 'game-co-tuong.html'
      - 'game-dia-oc.html'
      - 'assets/arena/game-room-shell.css'
      - 'assets/arena/game-room-shell.js'
      - 'assets/arena/game-room-embed.css'
      - 'assets/arena/game-room-embed.js'
      - 'assets/arena/app.js'
      - 'assets/arena/reference-v1.js'
      - 'mrlee-game-arena.html'
      - 'tools/browser-game-rooms.mjs'
      - '.github/workflows/mrlee-game-rooms-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check syntax and all site/Cloudflare links
        run: |
          node --check assets/arena/app.js
          node --check assets/arena/game-room-shell.js
          node --check assets/arena/game-room-embed.js
          node --check assets/arena/reference-v1.js
          node --check tools/browser-game-rooms.mjs
          node tools/check-site.mjs
          node tools/build-cloudflare-pages.mjs
          node tools/check-cloudflare-pages-build.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test all six standalone mobile and PvP flows
        run: node tools/browser-game-rooms.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrlee-standalone-game-room-screenshots
          path: artifacts/game-rooms/*.png
          if-no-files-found: ignore
          retention-days: 14
