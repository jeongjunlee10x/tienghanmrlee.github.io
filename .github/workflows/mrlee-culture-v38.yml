name: MR LEE Culture V38 — verified emergency assistance images
on:
  push:
    branches: [main]
    paths:
      - 'assets/culture/emergency-v38-sources.json'
      - 'tools/build-culture-emergency-v38.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: culture-v38-emergency-photo-build
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Download verified originals and export five 3-to-2 photos
        run: python tools/build-culture-emergency-v38.py
      - name: Publish verified images with SHA-256 and license metadata
        run: |
          git config user.name "mrlee-photo-qa[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/culture-v38-photo/goi-cuu-ho/ assets/culture/emergency-v38-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Culture V38: publish five emergency-service 3-to-2 photos with verified credits"
            git push origin HEAD:main
          fi
