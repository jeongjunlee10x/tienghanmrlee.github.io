name: MR LEE Culture V23 — verify 20 original AI assets
on:
  push:
    branches: [main]
    paths:
      - 'images/culture-v23-ai/**'
      - 'assets/culture/v23-manifest.json'
      - 'mrlee-culture-v23-captions.js'
      - 'mrlee-culture-hd-v19.js'
      - 'mrlee-culture-v13-data.js'
      - 'assets/culture/tradition-gallery-v1.css'
      - 'tools/check-culture-topic3.mjs'
      - 'van-hoa-bai-hoc.html'
  pull_request:
    branches: [main]
    paths:
      - 'images/culture-v23-ai/**'
      - 'assets/culture/v23-manifest.json'
      - 'mrlee-culture-v23-captions.js'
      - 'mrlee-culture-hd-v19.js'
      - 'tools/check-culture-v23.mjs'
      - 'tools/browser-smoke.mjs'
      - 'van-hoa-han-quoc.html'
      - 'van-hoa-bai-hoc.html'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-culture-v23.mjs
      - name: Verify topic 03 five distinct WebP image binaries and static HTML
        run: node tools/check-culture-topic3.mjs
