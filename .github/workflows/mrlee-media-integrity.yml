name: MR LEE - Media integrity and audio/image quality
on:
  pull_request:
    paths:
      - 'tools/audit-media-integrity.mjs'
      - 'tools/check-mp3-decode-sample.mjs'
      - 'tools/check-image-decoding.py'
      - 'tools/test-media-browser.mjs'
      - 'tools/mrlee-audio-v1.py'
      - 'tools/test-mrlee-audio-v1.py'
      - 'mrlee-listening-plus.js'
      - 'assets/branding/media-quality-v3.js'
      - 'assets/images/**'
      - 'MRLEE_AUDIO/**'
      - 'MRLEE_PRO_AUDIO/**'
      - 'assets/topik-v10/audio/**'
      - 'index.html'
      - 'hoc-theo-bai.html'
      - 'mrlee-bai-tap-pro.html'
      - 'van-hoa-han-quoc.html'
      - 'kiem-tra-topik.html'
      - '.github/workflows/mrlee-media-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate media tooling and browser scripts
        run: |
          node --check tools/audit-media-integrity.mjs
          node --check tools/check-mp3-decode-sample.mjs
          python -m py_compile tools/check-image-decoding.py
          node --check tools/test-media-browser.mjs
          node --check mrlee-listening-plus.js
          node --check assets/branding/media-quality-v3.js
          python -m py_compile tools/mrlee-audio-v1.py
      - name: Dual-voice cadence and browser speech regression
        run: |
          python tools/test-mrlee-audio-v1.py
          node tools/test-media-browser.mjs
      - name: Audit MP3 and images without changing originals
        run: |
          node tools/audit-media-integrity.mjs
          node tools/audit-topik-audio.mjs
      - name: Decode real MP3 samples and all image pixels (no changes)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check --only-binary=:all: 'Pillow==11.3.0'
          node tools/check-mp3-decode-sample.mjs
          python tools/check-image-decoding.py
      - name: Attach image sizes and broken-media findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrlee-audio-image-audit
          path: artifacts/media-integrity/*.json
          if-no-files-found: ignore
          retention-days: 14
