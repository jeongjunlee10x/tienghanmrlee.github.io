name: MR LEE Friends Popup and Public Table Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'game-*.html'
      - 'assets/arena/game-room-shell.js'
      - 'assets/arena/game-room-shell.css'
      - 'assets/arena/tienlen-approved-v24.css'
      - 'assets/arena/tienlen-approved-board-v24.css'
      - 'assets/arena/game-room-embed.css'
      - 'assets/arena/mobile-live.js'
      - 'assets/arena/game-room-social.js'
      - 'assets/arena/game-room-social.css'
      - 'assets/arena/game-art-direction.css'
      - 'assets/arena/drag-gestures.js'
      - 'assets/arena/gesture-motion.css'
      - 'assets/arena/card-turn-v2.css'
      - 'assets/arena/embedded-auth.js'
      - 'assets/arena/game-room-embed.js'
      - 'assets/arena/tienlen-ui.js'
      - 'assets/arena/rooms-play.js'
      - 'assets/arena/app.js'
      - 'assets/arena/ludo.js'
      - 'assets/arena/estate.js'
      - 'assets/arena/chess-ui.js'
      - 'assets/arena/chess-ai-worker.js'
      - 'assets/arena/xiangqi-ai-worker.js'
      - 'assets/arena/xiangqi.js'
      - 'assets/arena/color-engine.js'
      - 'assets/arena/tienlen-engine.js'
      - 'assets/arena/game-ux-v18.css'
      - 'assets/arena/game-visuals-v19.css'
      - 'assets/arena/game-visuals-v19.js'
      - 'assets/arena/game-room-v20.css'
      - 'assets/arena/gameplay-cards-v20.css'
      - 'assets/arena/gameplay-boards-v20.css'
      - 'assets/arena/arena-fidelity-v22.css'
      - 'assets/arena/arena-deal-v22.js'
      - 'tools/test-arena-v22.mjs'
      - 'tools/browser-motion-v22.mjs'
      - 'tools/browser-tienlen-v22.mjs'
      - 'tools/test-arena-v20.mjs'
      - 'assets/arena/premium-fx.js'
      - 'assets/arena/tienlen-fx.js'
      - 'tools/test-arena-v19.mjs'
      - 'tools/browser-arena-v19.mjs'
      - 'tools/test-arena-v18.mjs'
      - 'tools/test-arena-game-modes.mjs'
      - 'tools/test-arena-gestures.mjs'
      - 'tools/test-arena-card-turn-v2.mjs'
      - 'tools/browser-card-turns.mjs'
      - 'assets/arena/game-room-browser.js'
      - 'assets/arena/game-room-browser.css'
      - 'tools/browser-arena-social.mjs'
      - 'tools/test-arena-create-jsonb.mjs'
      - 'supabase/functions/mrlee-arena-rooms/index.ts'
      - 'tools/browser-game-rooms.mjs'
      - '.github/workflows/mrlee-arena-social-qa.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static / API usage / Cloudflare build checks
        run: |
          node --check assets/arena/game-room-social.js
          node --check assets/arena/drag-gestures.js
          node --check assets/arena/tienlen-ui.js
          node --check assets/arena/rooms-play.js
          node --check assets/arena/app.js
          node --check assets/arena/game-room-browser.js
          node --check assets/arena/game-room-shell.js
          node --check assets/arena/mobile-live.js
          node --check tools/browser-game-rooms.mjs
          node --check tools/browser-card-turns.mjs
          node --check tools/test-arena-game-modes.mjs
          node --check assets/arena/ludo.js
          node --check assets/arena/estate.js
          node --check assets/arena/chess-ui.js
          node --check assets/arena/chess-ai-worker.js
          node --check assets/arena/xiangqi-ai-worker.js
          node --check assets/arena/xiangqi.js
          node --check assets/arena/tienlen-engine.js
          node --check assets/arena/color-engine.js
          node --check tools/test-arena-v18.mjs
          node tools/test-arena-v18.mjs
          node --check assets/arena/game-visuals-v19.js
          node --check tools/test-arena-v19.mjs
          node --check tools/browser-arena-v19.mjs
          node tools/test-arena-v19.mjs
          node --check tools/test-arena-v20.mjs
          node tools/test-arena-v20.mjs
          node --check assets/arena/tienlen-fx.js
          node --check assets/arena/arena-deal-v22.js
          node --check tools/test-arena-v22.mjs
          node --check tools/browser-motion-v22.mjs
          node --check tools/browser-tienlen-v22.mjs
          node tools/test-arena-v22.mjs
          node tools/test-arena-game-modes.mjs
          node --check tools/test-arena-gestures.mjs
          node tools/test-arena-gestures.mjs
          node --check assets/arena/embedded-auth.js
          node --check assets/arena/game-room-embed.js
          node --check tools/test-arena-card-turn-v2.mjs
          node tools/test-arena-card-turn-v2.mjs
          node --check tools/browser-arena-social.mjs
          node --check tools/test-arena-create-jsonb.mjs
          node tools/test-arena-create-jsonb.mjs
          node tools/check-site.mjs
          node tools/build-cloudflare-pages.mjs
          node tools/check-cloudflare-pages-build.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test popup Create / Join and dedicated real room listing
        run: node tools/browser-arena-social.mjs
      - name: Verify V19 2.5D six-game graphics and animation on desktop/mobile
        run: node tools/browser-arena-v19.mjs
      - name: Verify V22 real 52-card deal, center chop and server-ready mask on desktop/mobile
        run: node tools/browser-motion-v22.mjs
      - name: Verify production Tiến Lên actual 52-card start and post-deal 20s bot clock
        run: node tools/browser-tienlen-v22.mjs
      - name: Test real card-game turn popups and centered avatar clocks
        run: node tools/browser-card-turns.mjs
      - name: Test six game rooms at 390 portrait, 844 landscape and 1440 desktop
        run: node tools/browser-game-rooms.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrlee-popup-and-room-list-ui
          path: |
            artifacts/arena-social/*.png
            artifacts/game-rooms/*.png
          if-no-files-found: ignore
          retention-days: 14
