name: MR LEE Friends Popup and Public Table Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'game-*.html'
      - 'assets/arena/game-room-shell.js'
      - 'assets/arena/game-room-shell.css'
      - 'assets/arena/game-room-embed.css'
      - 'assets/arena/mobile-live.js'
      - 'assets/arena/game-room-social.js'
      - 'assets/arena/game-room-social.css'
      - 'assets/arena/game-art-direction.css'
      - 'assets/arena/drag-gestures.js'
      - 'assets/arena/gesture-motion.css'
      - 'assets/arena/tienlen-ui.js'
      - 'assets/arena/rooms-play.js'
      - 'assets/arena/app.js'
      - 'assets/arena/ludo.js'
      - 'assets/arena/estate.js'
      - 'assets/arena/chess-ui.js'
      - 'tools/test-arena-game-modes.mjs'
      - 'assets/arena/game-room-browser.js'
      - 'assets/arena/game-room-browser.css'
      - 'tools/browser-arena-social.mjs'
      - 'tools/test-arena-create-jsonb.mjs'
      - 'supabase/functions/mrlee-arena-rooms/index.ts'
      - 'tools/browser-game-rooms.mjs'
      - '.github/workflows/mrlee-arena-social-qa.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static / API usage / Cloudflare build checks
        run: |
          node --check assets/arena/game-room-social.js
          node --check assets/arena/drag-gestures.js
          node --check assets/arena/tienlen-ui.js
          node --check assets/arena/rooms-play.js
          node --check assets/arena/app.js
          node --check assets/arena/game-room-browser.js
          node --check assets/arena/game-room-shell.js
          node --check assets/arena/mobile-live.js
          node --check tools/browser-game-rooms.mjs
          node --check tools/test-arena-game-modes.mjs
          node --check assets/arena/ludo.js
          node --check assets/arena/estate.js
          node --check assets/arena/chess-ui.js
          node tools/test-arena-game-modes.mjs
          node --check tools/browser-arena-social.mjs
          node --check tools/test-arena-create-jsonb.mjs
          node tools/test-arena-create-jsonb.mjs
          node tools/check-site.mjs
          node tools/build-cloudflare-pages.mjs
          node tools/check-cloudflare-pages-build.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test popup Create / Join and dedicated real room listing
        run: node tools/browser-arena-social.mjs
      - name: Test six game rooms at 390 portrait, 844 landscape and 1440 desktop
        run: node tools/browser-game-rooms.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrlee-popup-and-room-list-ui
          path: |
            artifacts/arena-social/*.png
            artifacts/game-rooms/*.png
          if-no-files-found: ignore
          retention-days: 14
