name: MR LEE Smart UI 2027 - phase 1 QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/mrlee-v2/smart-shell.js'
      - 'assets/mrlee-ui2027/**'
      - 'tools/check-smart-ui2027*.mjs'
      - '.github/workflows/mrlee-smart-ui2027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mrlee-smart-ui2027-phase1
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and asset checks
        run: node tools/check-smart-ui2027.mjs
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Chromium desktop and mobile smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mrlee-smart-ui.log 2>&1 &
          sleep 2
          node tools/check-smart-ui2027-browser.mjs
      - name: Record result only after all checks succeed
        run: |
          mkdir -p assets/mrlee-ui2027
          printf '{"phase":"smart-home-v1","static":"PASS","browser":"PASS","test_commit":"%s"}\n' "$GITHUB_SHA" > assets/mrlee-ui2027/qa-passed.json
          git config user.name "mrlee-ui-qa[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/mrlee-ui2027/qa-passed.json
          if ! git diff --cached --quiet; then
            git commit -m "Smart UI 2027: automated browser QA passed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrlee-smart-ui2027-screenshots
          path: artifacts/smart-ui-*.png
          if-no-files-found: ignore
