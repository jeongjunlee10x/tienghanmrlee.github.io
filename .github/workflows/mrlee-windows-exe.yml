name: MR LEE Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/mrlee-windows-exe.yml'

permissions:
  contents: read

concurrency:
  group: mrlee-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    name: Build installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout desktop sources and official logo only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            desktop
            assets/branding/logo-mrlee.png
          sparse-checkout-cone-mode: false

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare official Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python desktop/tools/make_icon.py assets/branding/logo-mrlee.png desktop/build

      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Test security and URL policy
        working-directory: desktop
        run: npm test

      - name: Create Windows 64-bit installer and portable EXE
        working-directory: desktop
        run: npm run build:win

      - name: Upload both Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: MR-LEE-Windows-EXE
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
