name: MR LEE Culture V27 — heritage and modern art QA
on:
  push:
    branches: [main]
    paths:
      - 'van-hoa-bai-hoc.html'
      - 'mrlee-culture-hd-v19.js'
      - 'mrlee-culture-v13-data.js'
      - 'mrlee-culture-v27-captions.js'
      - 'assets/culture/heritage-gallery-v1.css'
      - 'assets/culture/modern-gallery-v1.css'
      - 'assets/culture/modern-v36-published.json'
      - 'tools/check-culture-topic12.mjs'
      - 'assets/culture/heritage-v35-published.json'
      - 'tools/check-culture-topic11.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'images/culture-v27-art/**'
      - 'assets/culture/v27-manifest.json'
      - 'mrlee-culture-v27-captions.js'
      - 'mrlee-culture-hd-v19.js'
      - 'tools/check-culture-v27.mjs'
      - 'tools/browser-smoke.mjs'
      - 'van-hoa-han-quoc.html'
      - 'van-hoa-bai-hoc.html'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate artwork integrity, provenance and page integration
        run: node tools/check-culture-v27.mjs
      - name: Validate topic 11 landscape photo sources and SHA-256 checksums
        run: node tools/check-culture-topic11.mjs
      - name: Verify topic 12 modern Korea photos, credits and WebP integrity
        run: node tools/check-culture-topic12.mjs
