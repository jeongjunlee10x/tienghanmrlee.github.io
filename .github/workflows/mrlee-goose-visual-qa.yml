name: MR LEE Goose Cinematic Visual QA
on:
  pull_request:
    paths:
      - 'game-goose-pvp.html'
      - 'assets/arena/goose-pvp.js'
      - 'assets/arena/goose-pvp-skin.css'
      - 'assets/arena/goose-space-hangar.svg'
      - 'tools/browser-goose-visual.mjs'
      - '.github/workflows/mrlee-goose-visual-qa.yml'
  push:
    branches: [main]
    paths:
      - 'game-goose-pvp.html'
      - 'assets/arena/goose-pvp-skin.css'
      - 'assets/arena/goose-space-hangar.svg'
      - 'tools/browser-goose-visual.mjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  cinematic-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Desktop/mobile visual QA
        run: node tools/browser-goose-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goose-cinematic-preview
          path: artifacts/goose-visual/*.png
          retention-days: 14
          if-no-files-found: ignore
