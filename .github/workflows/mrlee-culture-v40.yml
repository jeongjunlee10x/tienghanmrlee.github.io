name: MR LEE Culture V40 - five licensed Korean bus photos
on:
  push:
    branches: [main]
    paths:
      - 'assets/culture/bus-v40-sources.json'
      - 'tools/build-culture-bus-v40.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: culture-v40-bus-build
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Download five verified Wikimedia originals and generate 3-to-2 WebP photos
        run: python tools/build-culture-bus-v40.py
      - name: Publish all five photographs with SHA256 metadata
        run: |
          git config user.name "mrlee-photo-qa[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/culture-v40-photo/xe-buyt/ assets/culture/bus-v40-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Culture V40: publish five licensed Korean bus landscape photos"
            git push origin HEAD:main
          fi
