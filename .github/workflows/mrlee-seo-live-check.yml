name: MR LEE - Live SEO and Cloudflare public diagnostic
on:
  # GitHub Actions scheduled check: 09:31 Asia/Bangkok daily.
  # Read-only probe; never submits to Search Console or deploys Cloudflare.
  schedule:
    - cron: '31 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/check-live-seo.mjs'
      - '.github/workflows/mrlee-seo-live-check.yml'
permissions:
  contents: read
jobs:
  public-http-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and public HTTP GET checks (no authentication)
        run: |
          node --check tools/check-live-seo.mjs
          node tools/check-live-seo.mjs
      - name: Attach response status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrlee-public-seo-http-report
          path: artifacts/seo-live/report.json
          if-no-files-found: ignore
          retention-days: 14
