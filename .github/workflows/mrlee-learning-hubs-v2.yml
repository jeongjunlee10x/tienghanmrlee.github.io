name: MR LEE Four Learning Subpages V2 - browser QA
on:
  push:
    branches: [main]
    paths:
      - 'hoc-tieng-han.html'
      - 'giao-tiep-phong-van.html'
      - 'kiem-tra-topik.html'
      - 'mrlee-bai-tap-pro.html'
      - 'assets/mrlee-ui2027/learning-hubs-v2.css'
      - 'assets/mrlee-ui2027/learning-hubs-v2.js'
      - 'tools/check-learning-hubs-v2*.mjs'
      - '.github/workflows/mrlee-learning-hubs-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify links, original functionality and photo integrity
        run: node tools/check-learning-hubs-v2.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Render visual-only smoke tests (not a Firebase login test)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mrlee-subv2.log 2>&1 &
          sleep 2
          node tools/check-learning-hubs-v2-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrlee-learning-subv2-screenshots
          path: artifacts/subv2-*.png
          if-no-files-found: ignore
