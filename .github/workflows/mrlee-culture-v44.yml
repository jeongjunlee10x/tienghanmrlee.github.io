name: MR LEE Culture V44 - licensed Korean pedestrian traffic photos
on:
  push:
    branches: [main]
    paths:
      - 'assets/culture/traffic-v44-sources.json'
      - 'tools/build-culture-traffic-v44.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: culture-v44-traffic-build
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python tools/build-culture-traffic-v44.py
      - name: Publish five licensed Korean traffic-safety photographs
        run: |
          git config user.name "mrlee-photo-qa[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/culture-v44-photo/an-toan-giao-thong/ assets/culture/traffic-v44-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Culture V44: publish five licensed pedestrian safety photographs"
            git push origin HEAD:main
          fi
