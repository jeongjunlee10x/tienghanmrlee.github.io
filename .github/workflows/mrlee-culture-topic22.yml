name: MR LEE Culture Topic 22 - traffic photo gallery QA
on:
  push:
    branches: [main]
    paths:
      - 'van-hoa-bai-hoc.html'
      - 'mrlee-culture-hd-v19.js'
      - 'mrlee-culture-v13-data.js'
      - 'assets/culture/traffic-gallery-v1.css'
      - 'assets/culture/traffic-v44-published.json'
      - 'tools/check-culture-topic22.mjs'
      - 'tools/check-culture-topic22-browser.mjs'
      - '.github/workflows/mrlee-culture-topic22.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-culture-topic22.mjs
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Browser smoke test - desktop and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mrlee-topic22-web.log 2>&1 &
          sleep 2
          node tools/check-culture-topic22-browser.mjs
      - name: Record passed browser QA on main
        run: |
          mkdir -p assets/culture
          echo '{"topic":"an-toan-giao-thong","gallery":5,"resolution":"1536x1024","desktop":"PASS","mobile":"PASS","static":"PASS"}' > assets/culture/traffic-topic22-qa.json
          git config user.name "mrlee-culture-qa[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/culture/traffic-topic22-qa.json
          if ! git diff --cached --quiet; then
            git commit -m "Culture topic22: automated Chromium desktop/mobile QA passed"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrlee-topic22-browser-screenshots
          path: artifacts/topic22-*.png
          if-no-files-found: ignore
