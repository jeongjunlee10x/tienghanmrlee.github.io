      - 'topik-nghe-24-cau.html'
      - '.github/workflows/mrlee-next-qa.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm toán kích thước ảnh toàn website
        run: node tools/audit-image-quality.mjs
      - name: Kiểm tra bộ dữ liệu địa giới và ký túc xá
        run: node tools/check-admin-map-and-ktx.mjs
      - name: Kiểm tra trang, tệp, liên kết, mã nguồn và biểu đồ Admin
        run: node tools/mrlee-next-qa.mjs
      - name: Kiểm tra logo mascot trên tất cả các trang thực tế
        run: node tools/check-brand-consistency.mjs
      - name: Kiểm tra Smart V3 — ảnh, menu, logo, Admin
        run: node tools/check-mrlee-smart.mjs
      - name: Kiểm tra 110 ảnh văn hóa thực, kích thước và 22 chủ đề
        run: node tools/check-culture-hd-v19.mjs
      - name: Kiểm tra V4 — ảnh WebP thật, không trùng và liên kết trang con
        run: node tools/check-mrlee-v4.mjs
      - name: Kiểm tra V5 — các nút gọn, đúng liên kết, tự mở nội dung thật
        run: node tools/check-mrlee-v5.mjs
      - name: Rà soát toàn bộ HTML, đường dẫn, ảnh và JS
        run: node tools/audit-full-site.mjs
      - name: Đối chiếu 24 MP3 với catalog âm thanh thật
        run: node tools/audit-topik-audio.mjs
        continue-on-error: true
      - name: Rà soát ảnh và font của toàn bộ CSS đang sử dụng
        run: node tools/audit-css-assets.mjs
      - name: Xác minh trợ lý tra cứu đủ 90 bài học
        run: node tools/check-mrlee-ai.mjs
      - name: Kiểm tra lệnh QA chung trên website
        run: node tools/check-site.mjs
      - name: Kiểm tra V2 AI — 10 ảnh WebP thật và 10 trang đã gắn
        run: node tools/check-mrlee-ai-v2-direct.mjs
      - name: Kiểm tra đường dẫn ảnh V3 — giữ nguyên ảnh cũ nếu ảnh mới thiếu
        run: node tools/check-mrlee-v3-live.mjs
      - name: MR LEE 800 — desktop one-screen homepage, mobile safe and hero images
        run: node tools/check-mrlee800-home.mjs
      - name: Kiểm toán cơ chế điểm thưởng, chỉ đọc
        run: node tools/audit-mrlee-rewards.mjs
      - name: Kiểm thử thang điểm Spark thực tế và thông báo công khai
        run: node tools/test-score-policy.cjs
