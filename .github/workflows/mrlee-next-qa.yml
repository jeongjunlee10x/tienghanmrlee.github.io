name: MR LEE NEXT — Kiểm tra giao diện và liên kết
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'assets/mrlee-v2/**'
      - 'assets/mrlee-v4/**'
      - 'assets/mrlee-v5/**'
      - 'assets/mrlee-dual-ui/**'
      - 'assets/mrlee-next/**'
      - 'ban-do-dai-hoc-han-quoc.html'
      - 'dang-ky-tu-van.html'
      - 'tools/audit-mrlee-rewards.mjs'
      - 'admin.html'
      - 'tools/mrlee-next-qa.mjs'
      - 'tools/check-mrlee-v4.mjs'
      - 'tools/check-mrlee-v5.mjs'
      - 'tools/audit-full-site.mjs'
      - 'tools/check-mrlee-smart.mjs'
      - '.github/workflows/mrlee-next-qa.yml'
  push:
    branches: [main]
    paths:
      - 'assets/mrlee-next/**'
      - 'assets/mrlee-v2/**'
      - 'assets/mrlee-v4/**'
      - 'assets/mrlee-v5/**'
      - 'assets/mrlee-dual-ui/**'
      - 'hoc-tieng-han.html'
      - 'giao-tiep-theo-chu-de.html'
      - 'kiem-tra-topik.html'
      - 'giao-tiep-phong-van.html'
      - 'van-hoa-han-quoc.html'
      - 'ban-do-dai-hoc-han-quoc.html'
      - 'ban-do-dai-hoc-han-quoc-chi-tiet.html'
      - 'mrlee-bai-tap-pro.html'
      - 'trung-tam-hoc-vien.html'
      - 'bang-diem-tuan-v12.html'
      - 'admin.html'
      - 'index.html'
      - 'dang-ky-tu-van.html'
      - 'quy-tac-diem-mrlee.html'
      - 'tuyen-sinh.html'
      - 'tools/mrlee-next-qa.mjs'
      - 'tools/check-mrlee-v4.mjs'
      - 'tools/check-mrlee-v5.mjs'
      - 'tools/audit-mrlee-rewards.mjs'
      - '.github/workflows/mrlee-next-qa.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm tra trang, tệp, liên kết, mã nguồn và biểu đồ Admin
        run: node tools/mrlee-next-qa.mjs
      - name: Kiểm tra Smart V3 — ảnh, menu, logo, Admin
        run: node tools/check-mrlee-smart.mjs
      - name: Kiểm tra V4 — ảnh WebP thật, không trùng và liên kết trang con
        run: node tools/check-mrlee-v4.mjs
      - name: Kiểm tra V5 — các nút gọn, đúng liên kết, tự mở nội dung thật
        run: node tools/check-mrlee-v5.mjs
      - name: Rà soát toàn bộ HTML, đường dẫn, ảnh và JS
        run: node tools/audit-full-site.mjs
      - name: Đối chiếu 24 MP3 với catalog âm thanh thật
        run: node tools/audit-topik-audio.mjs
        continue-on-error: true
      - name: Kiểm toán cơ chế điểm thưởng, chỉ đọc
        run: node tools/audit-mrlee-rewards.mjs
