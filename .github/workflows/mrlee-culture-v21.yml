name: MR LEE Culture V21 — render new art assets
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/culture-v21-redesign.py'
      - 'tools/check-culture-v21.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate 65 entirely new editorial illustrations
        run: python tools/culture-v21-redesign.py
      - name: Verify every new picture and route
        run: node tools/check-culture-v21.mjs
      - name: Commit verified art to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/culture-v21-new assets/culture/v21-manifest.json
          if git diff --cached --quiet; then
            echo 'Images are already present'
          else
            git commit -m 'assets(culture-v21): 65 newly designed topic pictures'
            git push origin HEAD:mrlee-v21-culture-replace-real-art
          fi
