name: MR LEE Discover and Classic Games QA
on:
  push:
    branches: [main]
    paths:
      - 'mrlee-game-arena.html'
      - 'assets/arena/discovery.css'
      - 'assets/arena/discovery.js'
      - 'assets/arena/game-polish.css'
      - 'assets/arena/chess-ui.js'
      - 'assets/arena/tienlen-ui.js'
      - 'assets/arena/rooms-play.js'
      - 'tools/browser-arena-discovery.mjs'
      - '.github/workflows/mrlee-discovery-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and rule checks
        run: |
          node --check assets/arena/discovery.js
          node --check assets/arena/chess-ui.js
          node --check assets/arena/tienlen-ui.js
          node --check assets/arena/rooms-play.js
          node --check tools/browser-arena-discovery.mjs
          node tools/test-arena-strategy.mjs
          node tools/test-arena-rooms.mjs
      - name: Site and Cloudflare build checks
        run: |
          node tools/check-site.mjs
          node tools/build-cloudflare-pages.mjs
          node tools/check-cloudflare-pages-build.mjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Responsive full-game interaction
        run: node tools/browser-arena-discovery.mjs
