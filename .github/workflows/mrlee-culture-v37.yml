name: MR LEE Culture V37 — CPR safely sourced photographs
on:
  push:
    branches: [main]
    paths:
      - 'assets/culture/cpr-v37-sources.json'
      - 'tools/build-culture-cpr-v37.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: culture-v37-cpr-photography
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Validate and produce five documentary CPR training WebP images
        run: python tools/build-culture-cpr-v37.py
      - name: Commit all image assets and their source/credit manifest
        run: |
          git config user.name "mrlee-photo-qa[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/culture-v37-photo/so-cap-cuu/ assets/culture/cpr-v37-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Culture V37: five safely sourced first aid training photographs"
            git push origin HEAD:main
          fi
