# SAFETY: Manual only. No automatic schema changes or live service deployment.
name: MR LEE Goose PvP - Manual Edge Function Deploy
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  deploy-goose-function:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: goose-pvp-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: pkxqsboyotlyoizzxizb
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - name: Require explicit Supabase access token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN in repository secrets first."
            exit 1
          fi
      - name: Deploy only the Goose function (NOT existing Arena APIs)
        run: supabase functions deploy mrlee-goose-pvp --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Smoke-check published health endpoint
        run: |
          curl --fail --silent --show-error \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/mrlee-goose-pvp?action=health"
