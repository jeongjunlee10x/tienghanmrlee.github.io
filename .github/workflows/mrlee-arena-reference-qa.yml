name: MR LEE Screenshot Reference Game Arena QA
on:
  push:
    branches: [main]
    paths:
      - 'mrlee-game-arena.html'
      - 'assets/arena/reference-v1.css'
      - 'assets/arena/reference-v1.js'
      - 'assets/arena/discovery.js'
      - 'assets/arena/daily-rewards.js'
      - 'tools/browser-arena-reference.mjs'
      - '.github/workflows/mrlee-arena-reference-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static and JavaScript integrity
        run: |
          node --check assets/arena/reference-v1.js
          node --check assets/arena/discovery.js
          node --check assets/arena/daily-rewards.js
          node --check tools/browser-arena-reference.mjs
          node tools/check-site.mjs
          node tools/build-cloudflare-pages.mjs
          node tools/check-cloudflare-pages-build.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Check exact reference dimensions and all interactive actions
        run: node tools/browser-arena-reference.mjs
      - name: Save visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrlee-arena-screenshot-reference-previews
          path: artifacts/arena-reference/*.png
          if-no-files-found: ignore
          retention-days: 14
