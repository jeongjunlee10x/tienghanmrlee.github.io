name: MR LEE UI 2027 - Phase 5 Visual QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/images/heroes/01-trang-chu-*.webp'
      - 'hoc-tieng-han.html'
      - 'kiem-tra-topik.html'
      - 'van-hoa-han-quoc.html'
      - 'van-hoa-bai-hoc.html'
      - 'mrlee-culture-v13-data.js'
      - 'ban-do-dai-hoc-han-quoc.html'
      - 'tuyen-sinh.html'
      - 'mrlee-bai-tap-pro.html'
      - 'admin.html'
      - 'assets/mrlee-ui2027/**'
      - 'tools/check-ui-phase5*.mjs'
      - '.github/workflows/mrlee-ui-phase5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mrlee-ui-phase5-qa
  cancel-in-progress: true
jobs:
  static-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ten active layouts and local assets
        run: node tools/check-ui-phase5.mjs
      - name: Set up Chromium for actual rendering
        run: |
          npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile in Fresh and Future
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mrlee-phase5-server.log 2>&1 &
          sleep 2
          node tools/check-ui-phase5-browser.mjs
      - name: Upload screenshots even when any check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrlee-ui-phase5-visual-audit
          path: artifacts/phase5/*.png
          retention-days: 14
          if-no-files-found: ignore
