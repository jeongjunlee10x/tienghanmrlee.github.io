name: MR LEE Arena MVP QA
on:
  push:
    branches: [feature/mrlee-arcade-mvp, feature/mrlee-arcade-chess-tienlen, feature/mrlee-tienlen-live-table-v2, feature/mrlee-arena-multiplayer-rooms]
    paths:
      - 'mrlee-game-arena.html'
      - 'assets/arena/**'
      - 'supabase/functions/mrlee-arena-rooms/**'
      - 'supabase/manual-sql/MRLEE_ARENA_*.sql'
      - 'tro-choi-tieng-han.html'
      - 'tools/test-arena.mjs'
      - 'tools/test-arena-strategy.mjs'
      - 'tools/test-tienlen-fx.mjs'
      - 'tools/test-arena-rooms.mjs'
      - 'tools/test-arena-live-api.mjs'
      - 'tools/browser-arena.mjs'
      - 'tools/browser-arena-strategy.mjs'
      - 'tools/browser-tienlen-live.mjs'
      - 'tools/browser-arena-rooms.mjs'
      - '.github/workflows/mrlee-arena-qa.yml'
  pull_request:
    paths:
      - 'mrlee-game-arena.html'
      - 'assets/arena/**'
      - 'supabase/functions/mrlee-arena-rooms/**'
      - 'supabase/manual-sql/MRLEE_ARENA_*.sql'
      - 'tro-choi-tieng-han.html'
      - 'tools/test-arena.mjs'
      - 'tools/browser-arena.mjs'
      - '.github/workflows/mrlee-arena-qa.yml'
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax
        run: |
          node --check assets/arena/color-engine.js
          node --check assets/arena/app.js
          node --check assets/arena/chess-engine.js
          node --check assets/arena/chess-ui.js
          node --check assets/arena/tienlen-engine.js
          node --check assets/arena/tienlen-ui.js
          node --check assets/arena/tienlen-fx.js
          node --check tools/test-tienlen-fx.mjs
          node --check tools/browser-tienlen-live.mjs
          node --check tools/browser-arena-rooms.mjs
          node --check tools/test-arena-rooms.mjs
          node --check tools/test-arena-live-api.mjs
          node --check assets/arena/room-api.js
          node --check assets/arena/rooms-ui.js
          node --check assets/arena/rooms-play.js
          node --check tools/test-arena.mjs
          node --check tools/browser-arena.mjs
      - name: Arena gameplay rules
        run: node tools/test-arena.mjs
      - name: Chess and Tien Len rules
        run: node tools/test-arena-strategy.mjs
      - name: Table visual effects and chop labels
        run: node tools/test-tienlen-fx.mjs
      - name: Multiplayer rooms and G ledger contract tests
        run: node tools/test-arena-rooms.mjs
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Type-check Edge room API
        run: deno check supabase/functions/mrlee-arena-rooms/index.ts
      - name: Live Arena API security smoke
        run: node tools/test-arena-live-api.mjs
      - name: Whole-site static QA
        run: node tools/check-site.mjs
      - name: Cloudflare Pages export
        run: |
          node tools/build-cloudflare-pages.mjs
          node tools/check-cloudflare-pages-build.mjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Mobile and desktop match smoke
        run: |
          node tools/browser-arena.mjs
          node tools/browser-arena-strategy.mjs
          node tools/browser-tienlen-live.mjs
          node tools/browser-arena-rooms.mjs
