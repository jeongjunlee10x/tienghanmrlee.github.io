name: MR LEE Culture V35 — create heritage landscape photography
on:
  push:
    branches: [main]
    paths:
      - 'assets/culture/heritage-v35-sources.json'
      - 'tools/build-culture-heritage-v35.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: culture-v35-heritage-photo-publish
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Download, verify and export five 3-to-2 history images
        run: python tools/build-culture-heritage-v35.py
      - name: Commit five local photos and license metadata
        run: |
          git config user.name "mrlee-photo-qa[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/culture-v35-photo/lich-su/ assets/culture/heritage-v35-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Culture V35: add five verified Korea heritage photographs"
            git push origin HEAD:main
          fi
