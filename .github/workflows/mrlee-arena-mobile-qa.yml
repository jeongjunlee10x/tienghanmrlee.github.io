name: MR LEE Arena Mobile and On-board Notices QA
on:
  push:
    branches: [main]
    paths:
      - "mrlee-game-arena.html"
      - "tro-choi-tieng-han.html"
      - "assets/arena/mobile-live.js"
      - "assets/arena/mobile-live.css"
      - "tools/browser-arena-mobile.mjs"
      - ".github/workflows/mrlee-arena-mobile-qa.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Syntax and site verification
        run: |
          node --check assets/arena/mobile-live.js
          node --check tools/browser-arena-mobile.mjs
          node tools/check-site.mjs
          node tools/build-cloudflare-pages.mjs
          node tools/check-cloudflare-pages-build.mjs
      - name: Install mobile Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Play Arena and Game Zone with touch-screen emulation
        run: node tools/browser-arena-mobile.mjs
