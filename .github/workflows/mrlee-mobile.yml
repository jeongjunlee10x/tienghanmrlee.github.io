name: MR LEE Mobile — Android APK + iOS Simulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mrlee-mobile.yml"

permissions:
  contents: read

concurrency:
  group: mrlee-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mobile sources and official MR LEE logo
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            mobile
            assets/branding/logo-mrlee.png
          sparse-checkout-cone-mode: false

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate mobile icons from original MR LEE logo
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python mobile/tools/generate_icons.py

      - name: Build Android APK
        run: gradle -p mobile/android :app:assembleDebug --no-daemon --stacktrace

      - name: Export Android APK
        run: |
          mkdir -p mobile/release
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/release/MR-LEE-Android-1.0.0-debug.apk
          ls -lh mobile/release/*.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-LEE-Android-APK
          path: mobile/release/*.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: Compile iOS app for Simulator (unsigned)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout mobile sources and official MR LEE logo
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            mobile
            assets/branding/logo-mrlee.png
          sparse-checkout-cone-mode: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon generator and XcodeGen
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.0.0
          brew install xcodegen
          python3 mobile/tools/generate_icons.py

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate --spec project.yml

      - name: Build simulator app (no Apple signing needed)
        working-directory: mobile/ios
        run: |
          xcodebuild -project MRLeeMobile.xcodeproj \
            -scheme MRLee -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS Simulator app (not an installable iPhone IPA)
        uses: actions/upload-artifact@v4
        with:
          name: MR-LEE-iOS-Simulator-Unsigned
          path: mobile/ios/build/derived/Build/Products/Debug-iphonesimulator/MRLee.app/
          if-no-files-found: error
          retention-days: 14
