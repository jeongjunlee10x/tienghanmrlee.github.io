name: MR LEE Culture V28 safety art QA
on:
  push:
    branches: [main]
    paths:
      - 'images/culture-v28-safe/**'
      - 'images/culture-v37-photo/**'
      - 'assets/culture/v28-manifest.json'
      - 'mrlee-culture-v28-captions.js'
      - 'mrlee-culture-hd-v19.js'
      - 'van-hoa-han-quoc.html'
      - 'van-hoa-bai-hoc.html'
      - 'tools/check-culture-v28.mjs'
      - 'assets/culture/cpr-gallery-v1.css'
      - 'assets/culture/cpr-v37-published.json'
      - 'tools/check-culture-topic13.mjs'
      - 'mrlee-culture-v13-data.js'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-culture-v28.mjs
      - run: node tools/check-culture-v27.mjs
      - run: node tools/check-culture-topic13.mjs
