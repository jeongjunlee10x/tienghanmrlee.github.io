name: MR LEE — Browser smoke công khai
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/browser-smoke.mjs'
      - 'tools/browser-theme-entry.mjs'
      - 'assets/mrlee-dual-ui/entry-picker.css'
      - 'tools/browser-topik-contrast.mjs'
      - 'assets/branding/topik-contrast-v1.css'
      - 'topik-*.html'
      - 'lo-trinh-topik.html'
      - 'assets/mrlee-geo/**'
      - 'assets/branding/media-quality-v3.*'
      - 'assets/branding/site-logo.js'
      - 'tuyen-sinh.html'
      - 'on-luyen-phong-van.html'
      - 'assets/branding/admissions-intake.*'
      - 'assets/branding/admissions-readability-v2.css'
      - 'assets/branding/interview-question-list-fix.css'
      - 'tools/browser-admissions-interview.mjs'
      - 'tim-truong.html'
      - 'assets/branding/mrlee-child-polish-v1.css'
      - 'assets/mrlee-dual-ui/theme.js'
      - 'dang-ky-tu-van.html'
      - 'assets/branding/home-recovery.css'
      - 'assets/mrlee-v2/smart-shell.js'
      - 'assets/mrlee-geo/home-routing.js'
      - 'index.html'
      - '.github/workflows/mrlee-browser-smoke.yml'
      - 'mrlee-assistant.js'
      - 'mrlee-assistant.css'
      - 'mrlee-ai-config.js'
      - 'ai-tro-ly.html'
      - 'assets/mrlee-v4/**'
      - 'mrlee-culture-hd-v19.*'
      - 'van-hoa-han-quoc.html'
      - 'van-hoa-bai-hoc.html'
      - 'assets/mrlee-v5/**'
      - 'ban-do-dai-hoc-han-quoc.html'
      - 'dang-ky-tu-van.html'
  push:
    branches: [main]
    paths:
      - 'tools/browser-smoke.mjs'
      - 'tools/browser-theme-entry.mjs'
      - 'assets/mrlee-dual-ui/entry-picker.css'
      - 'tools/browser-topik-contrast.mjs'
      - 'assets/branding/topik-contrast-v1.css'
      - 'topik-*.html'
      - 'lo-trinh-topik.html'
      - 'assets/mrlee-geo/**'
      - 'assets/branding/media-quality-v3.*'
      - 'assets/branding/site-logo.js'
      - 'tuyen-sinh.html'
      - 'on-luyen-phong-van.html'
      - 'assets/branding/admissions-intake.*'
      - 'assets/branding/admissions-readability-v2.css'
      - 'assets/branding/interview-question-list-fix.css'
      - 'tools/browser-admissions-interview.mjs'
      - 'tim-truong.html'
      - 'assets/branding/mrlee-child-polish-v1.css'
      - 'assets/mrlee-dual-ui/theme.js'
      - 'dang-ky-tu-van.html'
      - 'assets/branding/home-recovery.css'
      - 'assets/mrlee-v2/smart-shell.js'
      - 'assets/mrlee-geo/home-routing.js'
      - 'index.html'
      - '.github/workflows/mrlee-browser-smoke.yml'
      - 'mrlee-assistant.js'
      - 'mrlee-assistant.css'
      - 'ai-tro-ly.html'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare headless Chromium only for browser tests
        run: |
          npm install --no-audit --no-fund --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Open public MR LEE pages and test offline lesson search on Fresh/Future
        run: node tools/browser-smoke.mjs
      - name: Verify entry picker only once per tab, on mobile/desktop, with no header buttons
        run: node tools/browser-theme-entry.mjs
      - name: Admissions pre-entry personalization and interview overflow in both themes
        run: node tools/browser-admissions-interview.mjs
      - name: TOPIK I/II/Ngay Viet Nghe - WCAG contrast both themes desktop and mobile
        run: node tools/browser-topik-contrast.mjs

      - name: Save real Chromium homepage screenshots (both themes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrlee-home-visual-review
          path: artifacts/home-review/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Dong goi Phuong an B (index HTML + CSS hero da kiem thu)
        if: success()
        run: |
          mkdir -p artifacts/hero-b/assets/branding
          cp index.html artifacts/hero-b/index.html
          cp assets/branding/home-hero-split-v2.css artifacts/hero-b/assets/branding/home-hero-split-v2.css
          cat > artifacts/hero-b/HUONG_DAN_CAI_DAT.txt <<'END_INSTALL'
          MR LEE - PHUONG AN B - HERO TACH NOI DUNG VA ANH
          1. Backup file index.html trong thu muc website.
          2. Giai nen ZIP vao thu muc goc tienghanmrlee.github.io, chon ghi de index.html.
          3. Giu nguyen tat ca anh trong assets/images/heroes/ (2 file fresh/future da co tren GitHub).
          4. KHONG xoa nhung file CSS/JS khac. KHONG thay anh 8 chuyen muc.
          5. Mo website, nhan Ctrl+F5. Chon Fresh / Future de kiem tra.
          6. Neu co sua doi local chua push, dung git status truoc khi ghi de.
          END_INSTALL
      - name: Tai goi ma nguon Hero B de copy de
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mrlee-hero-phuong-an-b
          path: artifacts/hero-b/
          retention-days: 14
          if-no-files-found: error

      - name: Save subpage Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrlee-subpage-design-review
          path: artifacts/subpage-review/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Luu anh giao dien Van hoa Han Quoc V19 (sang/toi, desktop/mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrlee-culture-v19-visual-review
          path: artifacts/culture-review/*.png
          if-no-files-found: ignore
          retention-days: 7
