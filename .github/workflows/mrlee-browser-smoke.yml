name: MR LEE — Remaining browser workflows (theme, admissions, contrast)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/browser-theme-entry.mjs'
      - 'assets/mrlee-dual-ui/entry-picker.css'
      - 'tools/browser-topik-contrast.mjs'
      - 'assets/branding/topik-contrast-v1.css'
      - 'topik-*.html'
      - 'lo-trinh-topik.html'
      - 'assets/mrlee-geo/**'
      - 'assets/branding/media-quality-v3.*'
      - 'assets/branding/site-logo.js'
      - 'tuyen-sinh.html'
      - 'on-luyen-phong-van.html'
      - 'assets/branding/admissions-intake.*'
      - 'assets/branding/admissions-readability-v2.css'
      - 'assets/branding/interview-question-list-fix.css'
      - 'assets/branding/interview-question-list-v2.css'
      - 'tools/browser-admissions-interview.mjs'
      - 'tim-truong.html'
      - 'assets/branding/mrlee-child-polish-v1.css'
      - 'assets/mrlee-dual-ui/theme.js'
      - 'dang-ky-tu-van.html'
      - 'assets/branding/home-recovery.css'
      - 'assets/mrlee-v2/smart-shell.js'
      - 'assets/mrlee-geo/home-routing.js'
      - 'index.html'
      - 'assets/mrlee-v4/page-system.js'
      - 'assets/mrlee-v4/page-system.css'
      - 'assets/mrlee-v5/compact-shell.js'
      - 'assets/mrlee-v5/compact-shell.css'
      - 'assets/v31/premium-gallery.js'
      - 'assets/v31/premium-gallery.css'
      - '.github/workflows/mrlee-browser-smoke.yml'
      - 'mrlee-assistant.js'
      - 'mrlee-assistant.css'
      - 'mrlee-ai-config.js'
      - 'ai-tro-ly.html'
      - 'assets/mrlee-v4/**'
      - 'mrlee-culture-hd-v19.*'
      - 'van-hoa-han-quoc.html'
      - 'van-hoa-bai-hoc.html'
      - 'assets/mrlee-v5/**'
      - 'ban-do-dai-hoc-han-quoc.html'
      - 'dang-ky-tu-van.html'
  push:
    branches: [main]
    paths:
      - 'tools/browser-theme-entry.mjs'
      - 'assets/mrlee-dual-ui/entry-picker.css'
      - 'tools/browser-topik-contrast.mjs'
      - 'assets/branding/topik-contrast-v1.css'
      - 'topik-*.html'
      - 'lo-trinh-topik.html'
      - 'assets/mrlee-geo/**'
      - 'assets/branding/media-quality-v3.*'
      - 'assets/branding/site-logo.js'
      - 'tuyen-sinh.html'
      - 'on-luyen-phong-van.html'
      - 'assets/branding/admissions-intake.*'
      - 'assets/branding/admissions-readability-v2.css'
      - 'assets/branding/interview-question-list-fix.css'
      - 'assets/branding/interview-question-list-v2.css'
      - 'tools/browser-admissions-interview.mjs'
      - 'tim-truong.html'
      - 'assets/branding/mrlee-child-polish-v1.css'
      - 'assets/mrlee-dual-ui/theme.js'
      - 'dang-ky-tu-van.html'
      - 'assets/branding/home-recovery.css'
      - 'assets/mrlee-v2/smart-shell.js'
      - 'assets/mrlee-geo/home-routing.js'
      - 'index.html'
      - 'assets/mrlee-v4/page-system.js'
      - 'assets/mrlee-v4/page-system.css'
      - 'assets/mrlee-v5/compact-shell.js'
      - 'assets/mrlee-v5/compact-shell.css'
      - 'assets/v31/premium-gallery.js'
      - 'assets/v31/premium-gallery.css'
      - '.github/workflows/mrlee-browser-smoke.yml'
      - 'mrlee-assistant.js'
      - 'mrlee-assistant.css'
      - 'ai-tro-ly.html'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare headless Chromium only for browser tests
        run: |
          npm install --no-audit --no-fund --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify entry picker only once per tab, on mobile/desktop, with no header buttons
        run: node tools/browser-theme-entry.mjs
      - name: Admissions pre-entry personalization and interview overflow in both themes
        run: node tools/browser-admissions-interview.mjs
      - name: TOPIK I/II/Ngay Viet Nghe - WCAG contrast both themes desktop and mobile
        run: node tools/browser-topik-contrast.mjs

      # New V2/V3 page screenshots are produced by the dedicated, current workflows:
      # mrlee-home-rebuild-v2.yml, mrlee-learning-hubs-v2.yml, mrlee-workspaces-v3.yml.
