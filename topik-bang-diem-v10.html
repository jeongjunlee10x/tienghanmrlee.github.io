<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bảng điểm luyện tập V10 | MR LEE</title><link rel="stylesheet" href="assets/topik-v10/v10.css"><script defer src="assets/topik-v10/score.js"></script><style id="mrlee-auth-hide">body{visibility:hidden}</style><script type="module" src="auth-guard.js"></script></head><body><header class="v10-header"><a class="brand" href="index.html">TIẾNG HÀN <b>MR LEE</b></a><nav><a href="topik-on-cap-toc-v10.html">Học theo ngày</a><a href="topik-phong-luyen-v10.html">Luyện đề</a></nav></header><main class="v10-wrap"><section class="v10-hero"><span class="v10-eyebrow">BẢNG ĐIỂM LUYỆN TẬP MR LEE</span><h1>TIẾN ĐỘ CỦA BẠN<br><em>THEO TỪNG KỸ NĂNG</em></h1><p>Phân biệt điểm học, luyện nghe, luyện đề và thi thử. Kết quả được lưu trên trình duyệt, không phải bảng xếp hạng toàn server hoặc điểm TOPIK chính thức.</p></section><div class="v10-card" id="scoreview"><p>Đang tải dữ liệu...</p></div><div class="v10-toolbar"><button id="export" type="button">Xuất kết quả JSON</button></div></main><script>window.addEventListener('DOMContentLoaded',()=>{const s=window.MRLEE_SCORE_V10?.stats();const e=document.getElementById('scoreview');if(!s){e.textContent='Chưa có dữ liệu';return}const names={'bai-hoc-topik':'Bài tập từ vựng – ngữ pháp – đọc','nghe-topik':'Bài luyện nghe theo ngày','luyen-de-topik':'Phòng luyện đề','thi-topik':'Thi thử TOPIK','hoc':'Học','thi':'Thi'};const rows=Object.entries(s.categories);e.innerHTML=rows.length?'<h2>Tổng hợp điểm luyện tập</h2><div style="overflow-x:auto"><table class="v10-table"><thead><tr><th>Kỹ năng</th><th>Lượt ghi</th><th>Số câu đúng</th><th>Điểm tốt nhất (tổng)</th></tr></thead><tbody>'+rows.map(([k,v])=>'<tr><td>'+String(names[k]||k)+'</td><td>'+v.attempts+'</td><td>'+v.correct+'/'+v.total+'</td><td>'+v.points+'/'+v.maximum+'</td></tr>').join('')+'</tbody></table></div>':'<h2>Chưa có điểm luyện tập</h2><p>Bắt đầu ở mục Học theo ngày hoặc Phòng luyện đề để ghi nhận kết quả.</p>';document.getElementById('export').onclick=()=>{const blob=new Blob([window.MRLEE_SCORE_V10.export()],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='mrlee-diem-luyen-tap.json';a.click();URL.revokeObjectURL(u)}})</script></body></html>
