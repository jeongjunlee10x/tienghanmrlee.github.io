plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.mrlee.tienghan'
    compileSdk 36

    defaultConfig {
        applicationId 'vn.mrlee.tienghan'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
