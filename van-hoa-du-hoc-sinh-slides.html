const sources={
 "nha-o":{label:"Study in Korea · Nhà ở",url:"https://www.studyinkorea.go.kr/eng/life/livingAndHousing.do"},
 "ky-tuc-xa":{label:"Study in Korea · Ký túc xá",url:"https://www.studyinkorea.go.kr/eng/life/livingAndHousing.do"},
 "giao-thong":{label:"Study in Korea · Giao thông",url:"https://www.studyinkorea.go.kr/eng/life/livingAndHousing.do"},
 "mua-sam":{label:"Study in Korea · Chi phí sinh hoạt",url:"https://studyinkorea.go.kr/en/life/livingExpense.do"},
 "an-uong":{label:"Study in Korea · Chi phí sinh hoạt",url:"https://studyinkorea.go.kr/en/life/livingExpense.do"},
 "ngan-hang":{label:"Study in Korea · Ngân hàng",url:"https://www.studyinkorea.go.kr/eng/life/livingAndHousing.do"},
 "dien-thoai":{label:"Study in Korea · Điện thoại",url:"https://www.studyinkorea.go.kr/eng/life/livingAndHousing.do"},
 "mua-online":{label:"Study in Korea · Cẩm nang du học",url:"https://www.studyinkorea.go.kr/public/res/guide/guideBook_ko.pdf"}
};
let current=0,active=0,deck=[],speech="";
function make(t){
 const s=[];const add=(type,title,main,sub="",answer="")=>s.push({type,title,main,sub,answer});
 add("Bắt đầu",t.vi,t.ko,t.goal);
 add("Mục tiêu","Sau bài học","Nhận diện 10 từ vựng quan trọng",t.goal);
 add("Mục tiêu","Sau bài học","Vận dụng 8 mẫu câu giao tiếp","Tập nói theo ngữ cảnh, không chỉ dịch từng chữ");
 add("Bối cảnh","Khi nào cần kỹ năng này?",t.cases.slice(0,3).map((c,i)=>(i+1)+". "+c).join("\n"),"Thảo luận: Bạn từng gặp tình huống nào?");
 add("Bối cảnh","Khó khăn thực tế",t.cases.slice(3,6).map((c,i)=>(i+4)+". "+c).join("\n"),"Nêu rủi ro và cách tìm hỗ trợ.");
 add("Bối cảnh","Ứng xử an toàn",t.tip,"Đối chiếu quy định và thông tin chính thức hiện hành");
 t.terms.forEach((w,i)=>add("Từ vựng "+(i+1)+"/10",w[0],w[1],"Đọc to → nhắc lại → đặt một câu ngắn"));
 t.sentences.forEach((p,i)=>add("Hội thoại "+(i+1)+"/8",p[0],p[1],"Luyện vai A/B; thay thông tin bằng tình huống của bạn"));
 t.cases.forEach((c,i)=>add("Đóng vai "+(i+1)+"/9",c,"Học viên A: nêu nhu cầu. Học viên B: phản hồi bằng tiếng Hàn.","Gợi ý: "+t.sentences[i%t.sentences.length][0]+" — "+t.sentences[i%t.sentences.length][1]));
 t.terms.slice(0,8).forEach((w,i)=>{
  const other1=t.terms[(i+3)%10][1],other2=t.terms[(i+6)%10][1];
  const opts=[w[1],other1,other2];const shift=i%3;const ordered=opts.slice(shift).concat(opts.slice(0,shift));
  add("Kiểm tra "+(i+1)+"/8","Từ “"+w[0]+"” có nghĩa gì?","A. "+ordered[0]+"\nB. "+ordered[1]+"\nC. "+ordered[2],"Tự chọn đáp án trước khi bấm “Hiện đáp án”.","Đáp án: "+["A","B","C"][ordered.indexOf(w[1])]+". "+w[1]);
 });
 add("Tổng kết","10 từ vựng đã học",t.terms.slice(0,5).map(w=>w[0]+" · "+w[1]).join("\n"));
 add("Tổng kết","5 từ vựng còn lại",t.terms.slice(5).map(w=>w[0]+" · "+w[1]).join("\n"));
 add("Tổng kết","Thử thách cuối bài",t.cases[8],"Dùng ít nhất 2 mẫu câu tiếng Hàn để thực hành.");
 add("Tổng kết","Ghi nhớ trước khi thực hành",t.tip,"Bài học mang tính giáo dục; phí, quy định và thủ tục có thể thay đổi.");
 if(s.length!==45)throw new Error("Slide count mismatch: "+t.id+" "+s.length);return s;
}
function render(){
 const t=topics[active],s=deck[current];speech=(s.title.match(/[가-힣]+(?:\s+[가-힣]+)*/u)||[])[0]||"";$("slide").innerHTML='<div class="kicker">'+esc(s.type)+' · '+(current+1)+'/45</div><div class="topicName">'+esc(t.icon+" "+t.vi)+'</div><h2'+(speech?' class="ko" lang="ko"':'')+'>'+esc(s.title)+'</h2><div class="body'+(/[\uac00-\ud7a3]/.test(s.main)?' ko':'')+'">'+esc(s.main)+'</div>'+(s.sub?'<div class="secondary">'+esc(s.sub)+'</div>':'')+(s.answer?'<div class="answer" id="answer">'+esc(s.answer)+'</div>':'')+'<div class="bottom"><span>MR LEE · Giáo trình xem trước</span><a target="_blank" rel="noopener noreferrer" href="'+esc(sources[t.id].url)+'">'+esc(sources[t.id].label)+' ↗</a><span>'+esc(t.ko)+'</span></div>';
 $("counter").textContent=(current+1)+" / 45";$("progress").value=current+1;$("prev").disabled=current===0;$("next").disabled=current===44;$("reveal").hidden=!s.answer;$("speak").disabled=!speech;
 history.replaceState(null,"","#"+encodeURIComponent(t.id)+"/"+(current+1));
}
function loadTopic(i){active=i;current=0;deck=make(topics[active]);$("topic").value=topics[active].id;render();}
topics.forEach(t=>$("topic").add(new Option(t.icon+" "+t.vi,t.id)));$("topic").addEventListener("change",()=>loadTopic(topics.findIndex(t=>t.id===$("topic").value)));
$("prev").onclick=()=>{if(current>0){current--;render();}};$("next").onclick=()=>{if(current<44){current++;render();}};
$("reveal").onclick=()=>{const a=$("answer");if(a)a.classList.toggle("revealed");};
$("speak").onclick=()=>{if(!speech||!("speechSynthesis" in window)){alert("Không có chức năng phát âm trên thiết bị.");return;}const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith("ko"));speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech);u.lang="ko-KR";if(v)u.voice=v;u.rate=.85;u.onerror=()=>{alert("Không phát được âm thanh. Vui lòng bật giọng tiếng Hàn trong cài đặt thiết bị.")};speechSynthesis.speak(u);};
$("fullscreen").onclick=()=>{const el=$("slide");if(document.fullscreenElement)document.exitFullscreen?.();else el.requestFullscreen?.();};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.key==="ArrowRight"&&current<44){current++;render();}if(e.key==="ArrowLeft"&&current>0){current--;render();}});
let match=[];try{match=decodeURIComponent(location.hash.slice(1)).split("/")}catch{match=[]}const idx=topics.findIndex(t=>t.id===match[0]);loadTopic(idx<0?0:idx);const n=Number(match[1]);if(Number.isInteger(n)&&n>=1&&n<=45){current=n-1;render();}
let touchStart=null;
$("slide").addEventListener("touchstart",e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
$("slide").addEventListener("touchend",e=>{
 if(!touchStart||e.changedTouches.length!==1)return;
 const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;
 if(Math.abs(dx)<75||Math.abs(dx)<Math.abs(dy)*1.5)return;
 if(dx<0&&current<44){current++;render()}else if(dx>0&&current>0){current--;render()}
},{passive:true});
</script></body></html>
